name: jobportal-dev

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: jobportal-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - dev-net

networks:
  dev-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  influxdb_data:
  rabbitmq_data:

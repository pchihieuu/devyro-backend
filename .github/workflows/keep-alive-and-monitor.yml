name: Keep Alive & Monitor

on:
  schedule:
    - cron: "0 3 */3 * *" # ping Supabase mỗi 3 ngày lúc 3:00 UTC
    - cron: "0 2 * * *" # health-check Render mỗi ngày lúc 2:00 UTC
    - cron: "0 4 * * 1" # ping RabbitMQ (CloudAMQP) mỗi thứ Hai lúc 4:00 UTC
  workflow_dispatch: # cho phép chạy tay để test

jobs:
  ping-supabase:
    if: github.event.schedule == '0 3 */3 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset inactivity timer
        run: |
          http_code=$(curl -s -o /tmp/supabase_response.txt -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP status: $http_code"
          echo "Response body:"
          cat /tmp/supabase_response.txt

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Supabase heartbeat ping failed with status $http_code"
            exit 1
          fi

  check-render:
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Health-check Render backend
        id: healthcheck
        run: |
          check() {
            http_code=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" \
              --max-time 90 "${{ secrets.RENDER_HEALTH_URL }}")
            echo "HTTP status: $http_code"
            [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]
          }

          if check; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "First attempt failed, retrying in 10s..."
            sleep 10
            if check; then
              echo "status=ok" >> "$GITHUB_OUTPUT"
            else
              echo "Response body:"
              cat /tmp/render_response.txt
              echo "status=fail" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Notify Telegram on failure
        if: steps.healthcheck.outputs.status == 'fail'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="Render backend not responding! Checking: ${{ secrets.RENDER_HEALTH_URL }} — time: $(date -u '+%Y-%m-%d %H:%M UTC')"

  ping-rabbitmq:
    if: github.event.schedule == '0 4 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Ping RabbitMQ (publish + consume heartbeat)
        id: rabbitmqcheck
        env:
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
        run: |
          if node scripts/keep-rabbitmq-alive.js; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram on failure
        if: steps.rabbitmqcheck.outputs.status == 'fail'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="RabbitMQ keepalive ping failed! Instance may be at risk of CloudAMQP inactivity deletion — time: $(date -u '+%Y-%m-%d %H:%M UTC')"

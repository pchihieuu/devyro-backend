apiVersion: 1

providers:
  - name: "k6-dashboards"
    orgId: 1
    folder: "k6"
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    # editable: true
    options:
      path: /etc/grafana/provisioning/dashboards

  - name: "jobportal-dashboards"
    orgId: 1
    folder: "Job Portal"
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards

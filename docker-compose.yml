name: jobportal-dev

services:
  api:
    container_name: jobportal-api
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5000:5000"
    restart: on-failure
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: db 
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: "123456"
      DB_DATABASE: job_portal_dev
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev-net

  db:
    image: postgres:16-alpine
    container_name: jobportal-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: job_portal_dev
    ports:
      - "5433:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: jobportal-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - dev-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: jobportal-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - influxdb
    ports:
      - "3000:3000"
    networks:
      - dev-net

  influxdb:
    image: influxdb:1.8-alpine
    container_name: jobportal-influxdb
    restart: always
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    # ports:
    #   - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - dev-net

  k6:
    image: grafana/k6:0.50.0
    container_name: jobportal-k6
    volumes:
      - ./k6/scripts:/scripts 
    environment:
      K6_OUT: influxdb=http://influxdb:8086/k6
      BASE_URL: http://api:5000 
    networks:
      - dev-net
    depends_on:
      - influxdb
      - api

networks:
  dev-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  influxdb_data:
